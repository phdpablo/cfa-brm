project: # https://quarto.org/docs/manuscripts/
  type: manuscript # Specifies this project is a manuscript format.
  output-dir: docs # Directory where the rendered output files will be placed.
  # Do not change this key if you want to deploy on GitHub Pages.

execute: # https://quarto.org/docs/computations/execution-options.html
  freeze: auto # Automatically manage code execution based on changes.
  warning: false # Prevent R code chunk warnings from appearing in the output.
  message: false # Prevent R code chunk messages from appearing in the output.
  cache: true # Enable caching of code chunks to speed up rendering on subsequent runs.

manuscript: # https://quarto.org/docs/manuscripts/authoring/rstudio.html
  article: index.qmd # Main manuscript file.
  meca-bundle: false # Generate MECA bundle for journal submission.

bibliography: references.bib # https://quarto.org/docs/authoring/citations.html
# File containing the bibliographic references in BibTeX format.
csl: apa7ed.csl # Citation Style Language: see others at https://www.zotero.org/styles

# Website configuration (optional, for GitHub Pages deployment)
site-url: "https://phdpablo.github.io/cfa-brm/" # Edit your site URL.
# The base URL where the website will be published.
repo-url: "https://github.com/phdpablo/cfa-brm/" # Edit your repo URL.
# Link to the source code repository for this project.
open-graph: true # Generates Open Graph metadata for better social media previews.

format: # https://quarto.org/docs/reference/formats/html.html
  html:
    theme: spacelab # A clean, modern theme for HTML output.
  docx: default # Default Word document output format for the manuscript.
  pdf: default # Default PDF output format for the manuscript.

editor: source # Sets the default editor mode to source in RStudio.
