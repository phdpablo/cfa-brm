services:
  article:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    
    image: phdpablo/cfa-brm:4.5.2
    container_name: cfa-brm
    
    ports:
      - 127.0.0.1:8787:8787
    
    volumes:
      # TeX Live cache (survives container recreation)
      - texlive_data:/usr/local/texlive
      # Optional: RStudio session cache (local to project)
      - ./cache/.rstudio:/home/rstudio/.rstudio
    
    environment:
      - DISABLE_AUTH=true
      - RENV_PATHS_CACHE=/home/rstudio/renv/cache
      - RENV_PATHS_LIBRARY_ROOT=/home/rstudio/renv/library
    
    # Run init-latex.sh which syncs LaTeX on first start, then starts RStudio
    entrypoint: /init-latex.sh
    
    restart: unless-stopped

volumes:
  texlive_data:
    name: texlive_data